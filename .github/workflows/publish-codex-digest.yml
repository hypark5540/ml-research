name: Publish validated Codex research digest

on:
  workflow_dispatch:
    inputs:
      week_of:
        description: Exact Seoul publication date within the last 14 days
        required: true
        type: string
      candidate_b64:
        description: Canonical base64 of public sanitized UTF-8 JSON (at most 45 KiB)
        required: true
        type: string
      sha256:
        description: Lowercase SHA-256 of the exact decoded JSON bytes
        required: true
        type: string
      expected_public_sha:
        description: Exact 40-character public main commit expected by the sender
        required: true
        type: string

permissions:
  contents: read

# Share the existing publisher lock while the HF workflow remains available.
concurrency:
  group: weekly-ml-research-digest
  cancel-in-progress: false

jobs:
  validate:
    name: Independently validate the public candidate
    if: github.repository == 'hypark5540/ml-research' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      week_of: ${{ steps.digest.outputs.week_of }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out this exact public workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked validation runtime
        run: uv sync --frozen --extra dev

      - name: Check the trusted intake implementation
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Receive exact public candidate bytes
        id: digest
        # Read inputs from the event file; never interpolate candidate data into
        # shell code or step environment listings.
        run: |
          uv run --frozen python scripts/receive_codex_candidate.py receive \
            --event-file "$GITHUB_EVENT_PATH" \
            --output generated/weekly-digest.json

      - name: Require the blog's exact production schema before release
        env:
          EXPECTED_SHA256: ${{ steps.digest.outputs.sha256 }}
          WEEK_OF: ${{ steps.digest.outputs.week_of }}
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 65536 \
            --header 'Content-Type: application/json' \
            --data-binary @generated/weekly-digest.json \
            --output "$RUNNER_TEMP/codex-validation-response.json" \
            --write-out '%{http_code}' \
            https://www.hyoyoul.com/api/research-digests/validate)"
          uv run --frozen python scripts/receive_codex_candidate.py check-response \
            --response-file "$RUNNER_TEMP/codex-validation-response.json" \
            --status "$http_code" --week-of "$WEEK_OF" --sha256 "$EXPECTED_SHA256"
          (cd generated && sha256sum --check weekly-digest.sha256)

      - name: Upload only the independently approved public asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-codex-candidate
          path: |
            generated/weekly-digest.json
            generated/weekly-digest.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the exact immutable release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Download only the verified asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-codex-candidate
          path: generated

      - name: Create and attest the immutable weekly release
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK_OF: ${{ needs.validate.outputs.week_of }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd generated
          sha256sum --check weekly-digest.sha256
          actual_sha256="$(sha256sum weekly-digest.json | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo 'Downloaded artifact does not match the validated SHA-256.' >&2
            exit 1
          fi

          tag="research-${WEEK_OF}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Ref ${tag} exists without the expected release." >&2
              exit 1
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Weekly ML Research Digest ${WEEK_OF}" \
              --notes "Machine-readable, schema-validated public digest for HYOYOUL BLOG."
          fi

          release_id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json databaseId --jq '.databaseId')"
          release="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"

          if [[ "$(jq -r '.tag_name' <<< "$release")" != "$tag" ||
                "$(jq -r '.target_commitish' <<< "$release")" != "$GITHUB_SHA" ||
                "$(jq -r '.prerelease' <<< "$release")" != 'false' ]]; then
            echo "Release ${tag} is not bound to this exact workflow commit." >&2
            exit 1
          fi

          if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            if [[ "$(jq -r '.object.type' <<< "$ref")" != 'commit' ||
                  "$(jq -r '.object.sha' <<< "$ref")" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} does not point directly to ${GITHUB_SHA}." >&2
              exit 1
            fi
          elif [[ "$(jq -r '.draft' <<< "$release")" != 'true' ]]; then
            echo "Published release ${tag} has no matching tag ref." >&2
            exit 1
          fi

          asset_count="$(jq '[.assets[]?] | length' <<< "$release")"
          unexpected_count="$(jq '[.assets[]? | select(.name != "weekly-digest.json")] | length' <<< "$release")"
          if (( asset_count > 1 )) || [[ "$unexpected_count" != '0' ]]; then
            echo "Release ${tag} contains an unexpected asset set." >&2
            exit 1
          fi

          if (( asset_count == 1 )); then
            asset_api="$(jq -r '.assets[0].url' <<< "$release")"
            mkdir -p existing
            gh api -H 'Accept: application/octet-stream' "$asset_api" > existing/weekly-digest.json
            cmp --silent weekly-digest.json existing/weekly-digest.json || {
              echo "Release ${tag} already has different content." >&2
              exit 1
            }
          elif [[ "$(jq -r '.draft' <<< "$release")" == 'true' ]]; then
            gh release upload "$tag" weekly-digest.json --repo "$GITHUB_REPOSITORY"
          else
            echo "Published release ${tag} is missing its immutable asset." >&2
            exit 1
          fi

          release="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [[ "$(jq '[.assets[]?] | length' <<< "$release")" != '1' ||
                "$(jq -r '.assets[0].name' <<< "$release")" != 'weekly-digest.json' ||
                "$(jq -r '.assets[0].digest // empty' <<< "$release")" != "sha256:${EXPECTED_SHA256}" ]]; then
            echo "Release ${tag} asset name or server digest is invalid." >&2
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<< "$release")" == 'true' ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          elif [[ "$(jq -r '.immutable' <<< "$release")" != 'true' ]]; then
            echo "Existing published release ${tag} is not immutable." >&2
            exit 1
          fi

          for attempt in {1..12}; do
            published="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            if [[ "$(jq -r '.draft' <<< "$published")" == 'false' &&
                  "$(jq -r '.prerelease' <<< "$published")" == 'false' &&
                  "$(jq -r '.immutable' <<< "$published")" == 'true' &&
                  "$(jq -r '.target_commitish' <<< "$published")" == "$GITHUB_SHA" &&
                  "$(jq '[.assets[]?] | length' <<< "$published")" == '1' &&
                  "$(jq -r '.assets[0].digest // empty' <<< "$published")" == "sha256:${EXPECTED_SHA256}" ]]; then
              break
            fi
            if (( attempt == 12 )); then
              echo "Published release ${tag} failed immutable metadata verification." >&2
              exit 1
            fi
            sleep 5
          done

          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          if [[ "$(jq -r '.object.type' <<< "$ref")" != 'commit' ||
                "$(jq -r '.object.sha' <<< "$ref")" != "$GITHUB_SHA" ]]; then
            echo "Published tag ${tag} is not bound to ${GITHUB_SHA}." >&2
            exit 1
          fi

          asset_api="$(jq -r '.assets[0].url' <<< "$published")"
          mkdir -p verified
          gh api -H 'Accept: application/octet-stream' "$asset_api" > verified/weekly-digest.json
          cmp --silent weekly-digest.json verified/weekly-digest.json
          gh_version="$(gh version | sed -n '1s/^gh version \([^ ]*\).*/\1/p')"
          if [[ -z "$gh_version" ]] ||
             ! printf '%s\n%s\n' '2.93.0' "$gh_version" | sort -V -C; then
            echo "GitHub CLI ${gh_version} is below the safe release verification floor 2.93.0." >&2
            exit 1
          fi
          for attempt in {1..12}; do
            if gh release verify-asset "$tag" verified/weekly-digest.json \
              --repo "$GITHUB_REPOSITORY"; then
              break
            fi
            if (( attempt == 12 )); then
              echo "Release attestation for ${tag} was not verifiable." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Release ${tag} is immutable and bound to ${GITHUB_SHA}/${EXPECTED_SHA256}."

  alert:
    name: Notify owner of public intake or publication failure
    needs: [validate, publish]
    if: >-
      always() && github.repository == 'hypark5540/ml-research' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      (needs.validate.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open a generic owner-assigned issue with the failing run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee hypark5540
          --title "[Research blocked] Public Codex run ${GITHUB_RUN_ID}"
          --body "Public research validation or publication workflow failed. Inspect the run at https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
