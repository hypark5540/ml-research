name: Weekly ML Research Digest

on:
  schedule:
    # Every Sunday at 09:00 Asia/Seoul (00:00 UTC).
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      week_of:
        description: Digest publication date in YYYY-MM-DD (defaults to today)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-ml-research-digest
  cancel-in-progress: false

jobs:
  context:
    name: Prepare public research context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      week_of: ${{ steps.date.outputs.week_of }}
    steps:
      - name: Check out the public digest archive only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hypark5540/hyoyoul-blog-v1
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog
          sparse-checkout: content/public/research-digests.generated.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve publication date strictly
        id: date
        env:
          REQUESTED_WEEK: ${{ inputs.week_of }}
        run: |
          python3 - <<'PY'
          from datetime import date, datetime
          import os
          from zoneinfo import ZoneInfo

          requested = os.environ.get("REQUESTED_WEEK", "").strip()
          if requested:
              try:
                  week_of = date.fromisoformat(requested)
              except ValueError as error:
                  raise SystemExit("week_of must be an exact YYYY-MM-DD date") from error
              if week_of.isoformat() != requested:
                  raise SystemExit("week_of must be an exact YYYY-MM-DD date")
          else:
              week_of = datetime.now(ZoneInfo("Asia/Seoul")).date()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"week_of={week_of.isoformat()}", file=output)
          PY

      - name: Stage public context
        run: |
          test -s blog/content/public/research-digests.generated.json
          mkdir -p context
          cp blog/content/public/research-digests.generated.json context/

      - name: Upload public context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-context
          path: context/research-digests.generated.json
          if-no-files-found: error
          retention-days: 3

  research:
    name: Research in an isolated job
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ML_INTERN_CLI_CONFIG: ${{ github.workspace }}/config/ml-intern.ci.json
    steps:
      - name: Check out public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked research runtime
        run: uv sync --frozen --extra dev

      - name: Download public context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-context
          path: context

      - name: Render autonomous research prompt
        env:
          WEEK_OF: ${{ needs.context.outputs.week_of }}
        run: |
          mkdir -p generated
          uv run --frozen python scripts/render_prompt.py \
            --topics config/topics.json \
            --archive context/research-digests.generated.json \
            --output generated/weekly-digest.json \
            --week-of "$WEEK_OF" \
            > "$RUNNER_TEMP/ml-research-prompt.txt"

      - name: Research and write digest candidate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          uv run --frozen ml-intern --no-stream --max-iterations 90 \
            "$(< "$RUNNER_TEMP/ml-research-prompt.txt")"
          test -s generated/weekly-digest.json

      - name: Validate isolated candidate and write boundaries
        run: |
          uv run --frozen python scripts/validate_digest.py generated/weekly-digest.json
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'The research agent modified tracked automation files.' >&2
            git status --short >&2
            exit 1
          fi
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-candidate
          path: generated/weekly-digest.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Validate and publish without agent access
    needs: [context, research]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BLOG_REPO: hypark5540/hyoyoul-blog-v1
      BLOG_PATH: blog
    steps:
      - name: Check out automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked validation runtime
        run: uv sync --frozen --extra dev

      - name: Download isolated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-candidate
          path: generated

      - name: Check out blog after research isolation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BLOG_REPO }}
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: ${{ env.BLOG_PATH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and publish generated data
        run: |
          uv run --frozen python scripts/validate_digest.py generated/weekly-digest.json
          uv run --frozen python scripts/publish_digest.py \
            --digest generated/weekly-digest.json \
            --target blog/content/public/research-digests.generated.json
          uv run --frozen python scripts/validate_digest.py \
            --archive blog/content/public/research-digests.generated.json

      - name: Verify publish write boundaries
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'Tracked automation files changed during publish.' >&2
            git status --short >&2
            exit 1
          fi
          changed="$(git -C blog diff --name-only)"
          if [[ "$changed" != 'content/public/research-digests.generated.json' ]]; then
            echo 'Unexpected blog files changed:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Validate automation project
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Validate HYOYOUL BLOG
        working-directory: blog
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit and push digest branch
        working-directory: blog
        env:
          WEEK_OF: ${{ needs.context.outputs.week_of }}
          BLOG_REPO_TOKEN: ${{ secrets.BLOG_REPO_TOKEN }}
        run: |
          branch="automation/ml-research-${WEEK_OF}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add content/public/research-digests.generated.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "research: publish weekly ML digest ${WEEK_OF}"
          auth="$(printf 'x-access-token:%s' "$BLOG_REPO_TOKEN" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --set-upstream origin "$branch"
          unset auth
          printf 'BLOG_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Open blog pull request
        env:
          BLOG_REPO_TOKEN: ${{ secrets.BLOG_REPO_TOKEN }}
        run: |
          uv run --frozen python scripts/open_blog_pr.py \
            --repo "$BLOG_REPO" \
            --branch "$BLOG_BRANCH" \
            --week-of '${{ needs.context.outputs.week_of }}'
