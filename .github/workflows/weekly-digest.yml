name: Weekly ML Research Digest

on:
  schedule:
    # Every Sunday at 09:00 Asia/Seoul (00:00 UTC).
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      week_of:
        description: Digest publication date in YYYY-MM-DD (defaults to today)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-ml-research-digest
  cancel-in-progress: false

jobs:
  context:
    name: Prepare public research context
    if: github.repository == 'hypark5540/ml-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      week_of: ${{ steps.date.outputs.week_of }}
    steps:
      - name: Check out public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve a bounded Seoul publication date
        id: date
        env:
          REQUESTED_WEEK: ${{ inputs.week_of }}
        run: |
          python3 - <<'PY'
          from datetime import date, datetime, timedelta
          import os
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Seoul")).date()
          requested = os.environ.get("REQUESTED_WEEK", "").strip()
          if requested:
              try:
                  week_of = date.fromisoformat(requested)
              except ValueError as error:
                  raise SystemExit("week_of must be an exact YYYY-MM-DD date") from error
              if week_of.isoformat() != requested:
                  raise SystemExit("week_of must be an exact YYYY-MM-DD date")
          else:
              week_of = today

          if week_of > today:
              raise SystemExit("week_of must not be in the future in Asia/Seoul")
          if week_of < today - timedelta(days=14):
              raise SystemExit("week_of must be within the last 14 days")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"week_of={week_of.isoformat()}", file=output)
          PY

      - name: Download the public digest archive
        run: |
          mkdir -p context
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-redirs 3 --max-time 30 \
            --output context/research-context.json \
            'https://www.hyoyoul.com/api/research-digests?format=context'
          python3 - <<'PY'
          from pathlib import Path

          path = Path("context/research-context.json")
          size = path.stat().st_size
          if size < 2 or size > 512 * 1024:
              raise SystemExit(f"public research context has an invalid size: {size} bytes")
          PY

      - name: Upload public context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-context
          path: context/research-context.json
          if-no-files-found: error
          retention-days: 1

  research:
    name: Research in an isolated job
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ML_INTERN_CLI_CONFIG: ${{ github.workspace }}/config/ml-intern.ci.json
    steps:
      - name: Check out public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked research runtime
        run: uv sync --frozen --extra dev

      - name: Download public context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-context
          path: context

      - name: Render autonomous research prompt
        env:
          WEEK_OF: ${{ needs.context.outputs.week_of }}
        run: |
          mkdir -p generated
          uv run --frozen python scripts/render_prompt.py \
            --topics config/topics.json \
            --archive context/research-context.json \
            --output generated/weekly-digest.json \
            --week-of "$WEEK_OF" \
            > "$RUNNER_TEMP/ml-research-prompt.txt"

      - name: Research and write digest candidate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --frozen python -m ml_research.agent_runner \
            --prompt-file "$RUNNER_TEMP/ml-research-prompt.txt" \
            --output generated/weekly-digest.json \
            --max-iterations 90
          test -s generated/weekly-digest.json

      - name: Validate isolated candidate and write boundaries
        run: |
          uv run --frozen python scripts/validate_digest.py generated/weekly-digest.json
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'The research agent modified tracked automation files.' >&2
            git status --short >&2
            exit 1
          fi
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-candidate
          path: generated/weekly-digest.json
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Independently validate the public candidate
    needs: [context, research]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked validation runtime
        run: uv sync --frozen --extra dev

      - name: Download isolated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-candidate
          path: generated

      - name: Validate the exact public asset
        id: digest
        env:
          WEEK_OF: ${{ needs.context.outputs.week_of }}
        run: |
          uv run --frozen python scripts/validate_digest.py generated/weekly-digest.json
          actual_week="$(uv run --frozen python -c 'from pathlib import Path; from ml_research.io import read_json; print(read_json(Path("generated/weekly-digest.json"))["weekOf"])')"
          if [[ "$actual_week" != "$WEEK_OF" ]]; then
            echo "Candidate weekOf ${actual_week} does not match ${WEEK_OF}." >&2
            exit 1
          fi
          size="$(wc -c < generated/weekly-digest.json | tr -d ' ')"
          if (( size < 2 || size > 262144 )); then
            echo "Candidate size is outside the 256 KiB release boundary: ${size}." >&2
            exit 1
          fi
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

          digest_sha="$(sha256sum generated/weekly-digest.json | cut -d ' ' -f 1)"
          (cd generated && sha256sum weekly-digest.json > weekly-digest.sha256)
          echo "sha256=${digest_sha}" >> "$GITHUB_OUTPUT"

      - name: Require the blog's exact production schema before release
        env:
          EXPECTED_SHA256: ${{ steps.digest.outputs.sha256 }}
        run: |
          response="$(curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary @generated/weekly-digest.json \
            https://www.hyoyoul.com/api/research-digests/validate)"
          if [[ "$(jq -r '.valid' <<< "$response")" != 'true' ||
                "$(jq -r '.sha256' <<< "$response")" != "$EXPECTED_SHA256" ]]; then
            echo 'The blog production validator rejected or changed the candidate.' >&2
            exit 1
          fi

      - name: Upload the independently verified asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-research-candidate
          path: |
            generated/weekly-digest.json
            generated/weekly-digest.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the exact immutable release
    needs: [context, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Download only the verified asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-research-candidate
          path: generated

      - name: Create and attest the immutable weekly release
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK_OF: ${{ needs.context.outputs.week_of }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd generated
          sha256sum --check weekly-digest.sha256
          actual_sha256="$(sha256sum weekly-digest.json | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo 'Downloaded artifact does not match the validated SHA-256.' >&2
            exit 1
          fi

          tag="research-${WEEK_OF}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Ref ${tag} exists without the expected release." >&2
              exit 1
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Weekly ML Research Digest ${WEEK_OF}" \
              --notes "Machine-readable, schema-validated public digest for HYOYOUL BLOG."
          fi

          release_id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json databaseId --jq '.databaseId')"
          release="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"

          if [[ "$(jq -r '.tag_name' <<< "$release")" != "$tag" ||
                "$(jq -r '.target_commitish' <<< "$release")" != "$GITHUB_SHA" ||
                "$(jq -r '.prerelease' <<< "$release")" != 'false' ]]; then
            echo "Release ${tag} is not bound to this exact workflow commit." >&2
            exit 1
          fi

          if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            if [[ "$(jq -r '.object.type' <<< "$ref")" != 'commit' ||
                  "$(jq -r '.object.sha' <<< "$ref")" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} does not point directly to ${GITHUB_SHA}." >&2
              exit 1
            fi
          elif [[ "$(jq -r '.draft' <<< "$release")" != 'true' ]]; then
            echo "Published release ${tag} has no matching tag ref." >&2
            exit 1
          fi

          asset_count="$(jq '[.assets[]?] | length' <<< "$release")"
          unexpected_count="$(jq '[.assets[]? | select(.name != "weekly-digest.json")] | length' <<< "$release")"
          if (( asset_count > 1 )) || [[ "$unexpected_count" != '0' ]]; then
            echo "Release ${tag} contains an unexpected asset set." >&2
            exit 1
          fi

          if (( asset_count == 1 )); then
            asset_api="$(jq -r '.assets[0].url' <<< "$release")"
            mkdir -p existing
            gh api -H 'Accept: application/octet-stream' "$asset_api" > existing/weekly-digest.json
            cmp --silent weekly-digest.json existing/weekly-digest.json || {
              echo "Release ${tag} already has different content." >&2
              exit 1
            }
          elif [[ "$(jq -r '.draft' <<< "$release")" == 'true' ]]; then
            gh release upload "$tag" weekly-digest.json --repo "$GITHUB_REPOSITORY"
          else
            echo "Published release ${tag} is missing its immutable asset." >&2
            exit 1
          fi

          release="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [[ "$(jq '[.assets[]?] | length' <<< "$release")" != '1' ||
                "$(jq -r '.assets[0].name' <<< "$release")" != 'weekly-digest.json' ||
                "$(jq -r '.assets[0].digest // empty' <<< "$release")" != "sha256:${EXPECTED_SHA256}" ]]; then
            echo "Release ${tag} asset name or server digest is invalid." >&2
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<< "$release")" == 'true' ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          elif [[ "$(jq -r '.immutable' <<< "$release")" != 'true' ]]; then
            echo "Existing published release ${tag} is not immutable." >&2
            exit 1
          fi

          for attempt in {1..12}; do
            published="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            if [[ "$(jq -r '.draft' <<< "$published")" == 'false' &&
                  "$(jq -r '.prerelease' <<< "$published")" == 'false' &&
                  "$(jq -r '.immutable' <<< "$published")" == 'true' &&
                  "$(jq -r '.target_commitish' <<< "$published")" == "$GITHUB_SHA" &&
                  "$(jq '[.assets[]?] | length' <<< "$published")" == '1' &&
                  "$(jq -r '.assets[0].digest // empty' <<< "$published")" == "sha256:${EXPECTED_SHA256}" ]]; then
              break
            fi
            if (( attempt == 12 )); then
              echo "Published release ${tag} failed immutable metadata verification." >&2
              exit 1
            fi
            sleep 5
          done

          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          if [[ "$(jq -r '.object.type' <<< "$ref")" != 'commit' ||
                "$(jq -r '.object.sha' <<< "$ref")" != "$GITHUB_SHA" ]]; then
            echo "Published tag ${tag} is not bound to ${GITHUB_SHA}." >&2
            exit 1
          fi

          asset_api="$(jq -r '.assets[0].url' <<< "$published")"
          mkdir -p verified
          gh api -H 'Accept: application/octet-stream' "$asset_api" > verified/weekly-digest.json
          cmp --silent weekly-digest.json verified/weekly-digest.json
          gh_version="$(gh version | sed -n '1s/^gh version \([^ ]*\).*/\1/p')"
          if [[ -z "$gh_version" ]] ||
             ! printf '%s\n%s\n' '2.93.0' "$gh_version" | sort -V -C; then
            echo "GitHub CLI ${gh_version} is below the safe release verification floor 2.93.0." >&2
            exit 1
          fi
          for attempt in {1..12}; do
            if gh release verify-asset "$tag" verified/weekly-digest.json \
              --repo "$GITHUB_REPOSITORY"; then
              break
            fi
            if (( attempt == 12 )); then
              echo "Release attestation for ${tag} was not verifiable." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Release ${tag} is immutable and bound to ${GITHUB_SHA}/${EXPECTED_SHA256}."
