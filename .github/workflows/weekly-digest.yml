name: Weekly ML Research Digest

on:
  schedule:
    # Every Sunday at 09:00 Asia/Seoul (00:00 UTC).
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      week_of:
        description: Digest publication date in YYYY-MM-DD (defaults to today)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-ml-research-digest
  cancel-in-progress: false

jobs:
  context:
    name: Prepare public research context
    if: github.repository == 'hypark5540/ml-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      week_of: ${{ steps.date.outputs.week_of }}
    steps:
      - name: Check out public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve a bounded Seoul publication date
        id: date
        env:
          REQUESTED_WEEK: ${{ inputs.week_of }}
        run: |
          python3 - <<'PY'
          from datetime import date, datetime, timedelta
          import os
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Seoul")).date()
          requested = os.environ.get("REQUESTED_WEEK", "").strip()
          if requested:
              try:
                  week_of = date.fromisoformat(requested)
              except ValueError as error:
                  raise SystemExit("week_of must be an exact YYYY-MM-DD date") from error
              if week_of.isoformat() != requested:
                  raise SystemExit("week_of must be an exact YYYY-MM-DD date")
          else:
              week_of = today

          if week_of > today:
              raise SystemExit("week_of must not be in the future in Asia/Seoul")
          if week_of < today - timedelta(days=14):
              raise SystemExit("week_of must be within the last 14 days")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"week_of={week_of.isoformat()}", file=output)
          PY

      - name: Download the public digest archive
        run: |
          mkdir -p context
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-redirs 3 --max-time 30 \
            --output context/research-digests.generated.json \
            https://www.hyoyoul.com/api/research-digests
          python3 - <<'PY'
          from pathlib import Path

          path = Path("context/research-digests.generated.json")
          size = path.stat().st_size
          if size < 2 or size > 2 * 1024 * 1024:
              raise SystemExit(f"public research archive has an invalid size: {size} bytes")
          PY

      - name: Upload public context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-context
          path: context/research-digests.generated.json
          if-no-files-found: error
          retention-days: 1

  research:
    name: Research in an isolated job
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ML_INTERN_CLI_CONFIG: ${{ github.workspace }}/config/ml-intern.ci.json
    steps:
      - name: Check out public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked research runtime
        run: uv sync --frozen --extra dev

      - name: Download public context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-context
          path: context

      - name: Render autonomous research prompt
        env:
          WEEK_OF: ${{ needs.context.outputs.week_of }}
        run: |
          mkdir -p generated
          uv run --frozen python scripts/render_prompt.py \
            --topics config/topics.json \
            --archive context/research-digests.generated.json \
            --output generated/weekly-digest.json \
            --week-of "$WEEK_OF" \
            > "$RUNNER_TEMP/ml-research-prompt.txt"

      - name: Research and write digest candidate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          uv run --frozen ml-intern --no-stream --max-iterations 90 \
            "$(< "$RUNNER_TEMP/ml-research-prompt.txt")"
          test -s generated/weekly-digest.json

      - name: Validate isolated candidate and write boundaries
        run: |
          uv run --frozen python scripts/validate_digest.py generated/weekly-digest.json
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'The research agent modified tracked automation files.' >&2
            git status --short >&2
            exit 1
          fi
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-candidate
          path: generated/weekly-digest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Validate and publish a public immutable release
    needs: [context, research]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install locked validation runtime
        run: uv sync --frozen --extra dev

      - name: Download isolated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-candidate
          path: generated

      - name: Validate the exact public asset
        env:
          WEEK_OF: ${{ needs.context.outputs.week_of }}
        run: |
          uv run --frozen python scripts/validate_digest.py generated/weekly-digest.json
          actual_week="$(python3 -c 'import json; print(json.load(open("generated/weekly-digest.json"))["weekOf"])')"
          if [[ "$actual_week" != "$WEEK_OF" ]]; then
            echo "Candidate weekOf ${actual_week} does not match ${WEEK_OF}." >&2
            exit 1
          fi
          size="$(wc -c < generated/weekly-digest.json | tr -d ' ')"
          if (( size < 2 || size > 262144 )); then
            echo "Candidate size is outside the 256 KiB release boundary: ${size}." >&2
            exit 1
          fi
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Create the immutable weekly release
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK_OF: ${{ needs.context.outputs.week_of }}
        run: |
          tag="research-${WEEK_OF}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Weekly ML Research Digest ${WEEK_OF}" \
              --notes "Machine-readable, schema-validated public digest for HYOYOUL BLOG."
          fi

          release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)"
          existing_url="$(jq -r '.assets[]? | select(.name == "weekly-digest.json") | .url' <<< "$release")"
          if [[ -n "$existing_url" ]]; then
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --max-redirs 3 --max-time 30 \
              --output "$RUNNER_TEMP/existing-weekly-digest.json" \
              "$existing_url"
            cmp --silent generated/weekly-digest.json "$RUNNER_TEMP/existing-weekly-digest.json" || {
              echo "Release ${tag} already exists with different content." >&2
              exit 1
            }
          elif [[ "$(jq -r '.isDraft' <<< "$release")" == 'true' ]]; then
            gh release upload "$tag" generated/weekly-digest.json --repo "$GITHUB_REPOSITORY"
          else
            echo "Published release ${tag} is missing its required immutable asset." >&2
            exit 1
          fi

          if [[ "$(jq -r '.isDraft' <<< "$release")" == 'true' ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          echo "Release ${tag} contains the exact immutable candidate."
